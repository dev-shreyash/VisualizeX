services:
  # -------------------------------------------------------------
  # 1. Reverse Proxy (Caddy with automatic HTTPS)
  # -------------------------------------------------------------
  reverse-proxy:
    image: caddy:2.8-alpine
    container_name: visualizex-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      visualizex-app:
        condition: service_healthy
    networks:
      - visualizex-network

  # -------------------------------------------------------------
  # 2. Frontend Application (Next.js 14)
  # -------------------------------------------------------------
  visualizex-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: visualizex-app:latest
    container_name: visualizex-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-visualizex}?schema=public
      INTERNAL_API_URL: http://visualizex-api:5000
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      visualizex-api:
        condition: service_healthy
    networks:
      - visualizex-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/server-status"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # -------------------------------------------------------------
  # 3. Execution Worker (Elysia.js / Bun Backend)
  # -------------------------------------------------------------
  visualizex-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: visualizex-api:latest
    container_name: visualizex-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URL: mongodb://mongo:27017/CODES
      MONGODB_DB_NAME: CODES
      MONGODB_CODE_COLLECTION: ${MONGODB_CODE_COLLECTION:-users}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      REQUIRE_S2S_AUTH: "true"
      MAX_CONCURRENT: ${MAX_CONCURRENT:-5}
      EXECUTION_TIMEOUT_MS: ${EXECUTION_TIMEOUT_MS:-3000}
      HOST_WORKSPACE_PATH: ${HOST_WORKSPACE_PATH:-/tmp/visualizex-workspaces}
      RUNNER_IMAGE: visualizex-runner:latest
    volumes:
      # Docker daemon socket (prefer rootless daemon socket on VPS)
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      # Shared host workspace mounted identically inside worker container
      - ${HOST_WORKSPACE_PATH:-/tmp/visualizex-workspaces}:${HOST_WORKSPACE_PATH:-/tmp/visualizex-workspaces}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - visualizex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # -------------------------------------------------------------
  # 4. MongoDB Database (Saved User Code)
  # -------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: visualizex-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - visualizex-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # -------------------------------------------------------------
  # 5. PostgreSQL Database (NextAuth User Authentication)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: visualizex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-visualizex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - visualizex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-visualizex}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# ---------------------------------------------------------------
# Persistent Storage Volumes
# ---------------------------------------------------------------
volumes:
  mongo_data:
    name: visualizex_mongo_data
  postgres_data:
    name: visualizex_postgres_data
  caddy_data:
    name: visualizex_caddy_data
  caddy_config:
    name: visualizex_caddy_config

# ---------------------------------------------------------------
# Isolated Application Network
# ---------------------------------------------------------------
networks:
  visualizex-network:
    name: visualizex_network
    driver: bridge

