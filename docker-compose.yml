# ==============================================================================
# VisualizeX Execution Backend - Docker Compose (VPS Deployment)
#
# Standalone execution worker + Caddy HTTPS reverse proxy.
# MongoDB runs on MongoDB Atlas cloud (no local database container needed).
# Frontend (/app) runs on Vercel.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy (Caddy with automatic HTTPS via Let's Encrypt)
  # (Optional: If you already run Nginx on your VPS, you can disable this service
  # and proxy directly to visualizex-api at 127.0.0.1:5000)
  # ----------------------------------------------------------------------------
  reverse-proxy:
    image: caddy:2.8-alpine
    container_name: visualizex-proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-${DOMAIN:-localhost}}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      visualizex-api:
        condition: service_healthy
    networks:
      - visualizex-network

  # ----------------------------------------------------------------------------
  # 2. Execution Worker & Code API (Elysia.js / Bun Backend)
  # ----------------------------------------------------------------------------
  visualizex-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: visualizex-api:latest
    container_name: visualizex-api
    restart: unless-stopped
    # Expose to localhost so an existing host Nginx or Caddy can connect directly
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # MongoDB Atlas Cloud Connection String
      MONGODB_URL: ${MONGODB_URL}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-CODES}
      MONGODB_CODE_COLLECTION: ${MONGODB_CODE_COLLECTION:-users}
      # Shared secret for HMAC-SHA256 authentication with Vercel frontend
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      REQUIRE_S2S_AUTH: ${REQUIRE_S2S_AUTH:-true}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-5}
      EXECUTION_TIMEOUT_MS: ${EXECUTION_TIMEOUT_MS:-3000}
      HOST_WORKSPACE_PATH: ${HOST_WORKSPACE_PATH:-/tmp/visualizex-workspaces}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-visualizex-runner:latest}
      CLIENT_URL: ${CLIENT_URL:-*}
    volumes:
      # Docker daemon socket (prefer rootless socket /run/user/<UID>/docker.sock on VPS)
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      # Shared host workspace mounted identically inside worker container
      - ${HOST_WORKSPACE_PATH:-/tmp/visualizex-workspaces}:${HOST_WORKSPACE_PATH:-/tmp/visualizex-workspaces}
    networks:
      - visualizex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  caddy_data:
    name: visualizex_caddy_data
  caddy_config:
    name: visualizex_caddy_config

# ------------------------------------------------------------------------------
# Isolated Application Network
# ------------------------------------------------------------------------------
networks:
  visualizex-network:
    name: visualizex_network
    driver: bridge
